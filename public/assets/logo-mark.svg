<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Qiskit Fall Fest Thailand site mark">
  <defs>
    <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B145A"/>
      <stop offset="100%" stop-color="#4A248F"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="30" fill="url(#mk)"/>
  <!-- vesica / superposition lens: two states overlapping -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M46 34 A 30 30 0 0 1 46 86" stroke="#B896F8"/>
    <path d="M74 34 A 30 30 0 0 0 74 86" stroke="#ED84B5"/>
  </g>
  <!-- measured outcome nodes -->
  <circle cx="46" cy="34" r="6.5" fill="#DCE4F9"/>
  <circle cx="74" cy="86" r="6.5" fill="#DCE4F9"/>
  <circle cx="60" cy="60" r="5" fill="#5587F7"/>
</svg>
