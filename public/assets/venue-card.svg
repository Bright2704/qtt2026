<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Venue card placeholder illustration">
  <defs>
    <linearGradient id="vsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B145A"/><stop offset="100%" stop-color="#4A248F"/>
    </linearGradient>
    <linearGradient id="vglow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ED84B5" stop-opacity=".9"/><stop offset="100%" stop-color="#B896F8" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#vsky)"/>
  <circle cx="640" cy="110" r="46" fill="#DCE4F9" opacity=".35"/>

  <!-- abstract campus / skyline silhouette -->
  <g fill="#0E0722" fill-opacity=".55">
    <rect x="70"  y="290" width="90"  height="180" rx="6"/>
    <rect x="180" y="230" width="70"  height="240" rx="6"/>
    <rect x="270" y="320" width="120" height="150" rx="6"/>
    <rect x="410" y="200" width="80"  height="270" rx="6"/>
    <rect x="510" y="300" width="140" height="170" rx="6"/>
    <rect x="670" y="255" width="70"  height="215" rx="6"/>
  </g>
  <g fill="#DCE4F9" fill-opacity=".45">
    <rect x="196" y="252" width="12" height="12" rx="2"/><rect x="220" y="252" width="12" height="12" rx="2"/>
    <rect x="196" y="286" width="12" height="12" rx="2"/><rect x="220" y="286" width="12" height="12" rx="2"/>
    <rect x="428" y="224" width="12" height="12" rx="2"/><rect x="454" y="224" width="12" height="12" rx="2"/>
    <rect x="428" y="258" width="12" height="12" rx="2"/><rect x="454" y="258" width="12" height="12" rx="2"/>
    <rect x="536" y="330" width="12" height="12" rx="2"/><rect x="562" y="330" width="12" height="12" rx="2"/>
  </g>
  <rect x="0" y="466" width="800" height="34" fill="url(#vglow)" opacity=".7"/>
  <g fill="none" stroke="#DCE4F9" stroke-opacity=".25" stroke-width="1.3">
    <path d="M0 150 Q 120 110 240 150 T 480 150 T 800 150"/>
